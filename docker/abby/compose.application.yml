name: dotlocker-abby-application

services:
  dotlocker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: dotlocker/application:${DOTLOCKER_IMAGE_TAG:-local}
    container_name: dotlocker-application
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DOTLOCKER_DATA_DIR: /data
      DOTLOCKER_DATABASE_URL: ${DOTLOCKER_DATABASE_URL:?Set DOTLOCKER_DATABASE_URL in the Abby env file}
      DOTLOCKER_S3_ENDPOINT: ${DOTLOCKER_S3_ENDPOINT:-http://dotlocker-garage:3900}
      DOTLOCKER_S3_REGION: ${DOTLOCKER_S3_REGION:-garage}
      DOTLOCKER_S3_BUCKET: ${DOTLOCKER_S3_BUCKET:?Set DOTLOCKER_S3_BUCKET in the Abby env file}
      DOTLOCKER_S3_ACCESS_KEY: ${DOTLOCKER_S3_ACCESS_KEY:?Set DOTLOCKER_S3_ACCESS_KEY in the Abby env file}
      DOTLOCKER_S3_SECRET_KEY: ${DOTLOCKER_S3_SECRET_KEY:?Set DOTLOCKER_S3_SECRET_KEY in the Abby env file}
      DOTLOCKER_COOKIE_SECURE: "true"
      KEYNAME_ISSUER_URL: ${KEYNAME_ISSUER_URL:-https://api.keyname.dev}
      DOTLOCKER_BOOTSTRAP_FIRST_KEYNAME_USER: ${DOTLOCKER_BOOTSTRAP_FIRST_KEYNAME_USER:-false}
      DOTLOCKER_BOOTSTRAP_ORG: ${DOTLOCKER_BOOTSTRAP_ORG:-honeycluster}
    ports:
      - "${ABBY_BIND_IP:?Set ABBY_BIND_IP to Abby's tailnet address}:${DOTLOCKER_ABBY_PORT:-5175}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ${ABBY_DATA_ROOT:-/vol/nvme/docker/pluto}/data:/data
    networks: [dotlocker]

networks:
  dotlocker:
    external: true
    name: dotlocker-abby
