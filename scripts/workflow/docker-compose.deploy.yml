name: pluto-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pluto
      POSTGRES_USER: pluto
      POSTGRES_PASSWORD: ${PLUTO_POSTGRES_PASSWORD:?PLUTO_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluto -d pluto"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  pluto:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pluto:${PLUTO_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PLUTO_DATA_DIR: /data
      PLUTO_DATABASE_URL: ${PLUTO_DATABASE_URL:-postgres://pluto:${PLUTO_POSTGRES_PASSWORD}@db:5432/pluto}
      PLUTO_COOKIE_SECURE: "true"
      KEYNAME_ISSUER_URL: ${KEYNAME_ISSUER_URL:-https://api.keyname.dev}
      PLUTO_BOOTSTRAP_FIRST_KEYNAME_USER: ${PLUTO_BOOTSTRAP_FIRST_KEYNAME_USER:-false}
      PLUTO_BOOTSTRAP_KEYNAME_EMAILS: ${PLUTO_BOOTSTRAP_KEYNAME_EMAILS:-}
      PLUTO_BOOTSTRAP_KEYNAME_DOMAINS: ${PLUTO_BOOTSTRAP_KEYNAME_DOMAINS:-}
      PLUTO_BOOTSTRAP_ORG: ${PLUTO_BOOTSTRAP_ORG:-honeycluster}
    ports:
      - "${PLUTO_PORT:-5175}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - data:/data

volumes:
  postgres:
  data:
