name: dotlocker-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pluto
      POSTGRES_USER: pluto
      POSTGRES_PASSWORD: ${DOTLOCKER_POSTGRES_PASSWORD:?DOTLOCKER_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluto -d pluto"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  pluto:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pluto:${DOTLOCKER_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DOTLOCKER_DATA_DIR: /data
      DOTLOCKER_DATABASE_URL: ${DOTLOCKER_DATABASE_URL:-postgres://pluto:${DOTLOCKER_POSTGRES_PASSWORD}@db:5432/pluto}
      DOTLOCKER_COOKIE_SECURE: "true"
      KEYNAME_ISSUER_URL: ${KEYNAME_ISSUER_URL:-https://api.keyname.dev}
      DOTLOCKER_BOOTSTRAP_FIRST_KEYNAME_USER: ${DOTLOCKER_BOOTSTRAP_FIRST_KEYNAME_USER:-false}
      DOTLOCKER_BOOTSTRAP_KEYNAME_EMAILS: ${DOTLOCKER_BOOTSTRAP_KEYNAME_EMAILS:-}
      DOTLOCKER_BOOTSTRAP_KEYNAME_DOMAINS: ${DOTLOCKER_BOOTSTRAP_KEYNAME_DOMAINS:-}
      DOTLOCKER_BOOTSTRAP_ORG: ${DOTLOCKER_BOOTSTRAP_ORG:-honeycluster}
    ports:
      - "${DOTLOCKER_PORT:-5175}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - data:/data

volumes:
  postgres:
  data:
