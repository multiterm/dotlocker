packages:
  - packages/libs/*
  - packages/apps/*

# Multiterm beta packages are pinned and integrity-locked but intentionally
# consumed immediately by this integration workspace.
minimumReleaseAge: 0

allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@multiterm/rune@0.4.1-b.15'
  - '@multiterm/release-sdk@0.4.1-b.18'
  - '@multiterm/release@0.4.1-b.18'
  - '@multiterm/release@0.4.1-b.19'
  - '@multiterm/release-sdk@0.4.1-b.19'
  - '@multiterm/release@0.4.1-b.20'
  - '@multiterm/rune-trpc@0.1.0-b.2'
  - '@multiterm/rune@0.4.1-b.17'
  - '@sandblocks/cli@0.3.0'
  - '@sandblocks/sdk@0.3.0'
