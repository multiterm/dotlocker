services:
  db:
    image: postgres:16-alpine
    container_name: dotlocker-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pluto
      POSTGRES_USER: pluto
      POSTGRES_PASSWORD: dotlocker_dev_change_me
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluto -d pluto"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - dotlocker-dev-postgres:/var/lib/postgresql/data

  pluto:
    build:
      context: .
    container_name: dotlocker-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DOTLOCKER_DATA_DIR: /data
      DOTLOCKER_DATABASE_URL: postgres://pluto:dotlocker_dev_change_me@db:5432/pluto
    ports:
      - "5175:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - dotlocker-dev-data:/data

volumes:
  dotlocker-dev-postgres:
  dotlocker-dev-data:
