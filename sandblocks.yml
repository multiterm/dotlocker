version: 2
name: dotlocker

workspace:
  image: node:22-bookworm
  setup: [corepack, pnpm, install, --frozen-lockfile, --config.minimumReleaseAge=0]

tasks:
  build:
    command: [corepack, pnpm, exec, rune, build]
    timeout: 20m
    outputs:
      - packages/apps/site/dist
      - packages/apps/webui/dist
      - packages/libs/cli/dist
      - packages/libs/client/dist
      - packages/libs/server/dist
      - packages/libs/shared/dist
      - packages/libs/ui/dist
      - packages/libs/ui-shared/dist

services:
  dotlocker:
    root: packages/libs/cli
    command: [node, ../../../scripts/workflow/sandblocks-start.mjs]
    port: 3000
    health: /v1/health
    resources: { memory: 2g, cpus: "2" }

checks:
  dotlocker-health:
    image: ./docker/images/Dockerfile.sandblocks-e2e
    timeout: 2m
    resources: { memory: 512m, cpus: "1" }

environments:
  preview:
    pipeline: [build]
    services: [dotlocker]
    checks: [dotlocker-health]
    routing:
      baseDomain: dotlocker.dev
      sso: true
  production:
    pipeline: [build]
    services: [dotlocker]
    checks: [dotlocker-health]
    routing:
      baseDomain: dotlocker.sh
      stableDomains:
        dotlocker: [dotlocker.dev, dotlocker.sh]
      sso: true
